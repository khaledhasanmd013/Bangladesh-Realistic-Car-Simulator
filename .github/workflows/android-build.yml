name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Godot Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.5

    env:
      HOME: /root
      DOCKER_CONFIG: /tmp/docker-config

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install font support
        run: |
          mkdir -p /tmp/docker-config
          apt-get update
          apt-get install -y fontconfig libfontconfig1

      - name: Configure Godot Android SDK settings
        run: |
          mkdir -p /root/.config/godot

          cat > /root/.config/godot/editor_settings-4.5.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Verify Android tools and templates
        run: |
          set -eux

          godot --version
          java -version

          test -d /usr/lib/android-sdk
          test -d /usr/lib/android-sdk/platforms/android-33
          test -d /usr/lib/android-sdk/build-tools/33.0.2
          test -f /usr/lib/android-sdk/platform-tools/adb

          test -d /usr/lib/jvm/java-17-openjdk-amd64/bin
          test -f /root/debug.keystore

          test -f /root/.local/share/godot/export_templates/4.5.stable/android_debug.apk
          test -f /root/.local/share/godot/export_templates/4.5.stable/android_release.apk

          cat /root/.config/godot/editor_settings-4.5.tres

      - name: Create Android export preset
        run: |
          mkdir -p build

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/BangladeshCarSimulator.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0

          keystore/debug=""
          keystore/debug_user=""
          keystore/debug_password=""
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0.0"

          package/unique_name="com.example.bangladeshcarsimulator"
          package/name="Bangladesh Realistic Car Simulator"
          package/signed=true
          EOF

      - name: Import Godot project
        run: |
          godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          godot --headless --verbose --path . \
            --export-debug "Android" \
            build/BangladeshCarSimulator.apk

          test -s build/BangladeshCarSimulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangladesh-Car-Simulator-APK
          path: build/BangladeshCarSimulator.apk
          if-no-files-found: error
