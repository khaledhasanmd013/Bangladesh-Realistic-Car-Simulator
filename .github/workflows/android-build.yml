name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Bangladesh Realistic Car Simulator
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.5

    env:
      HOME: /root
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      DOCKER_CONFIG: /tmp/docker-config

      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install required packages
        run: |
          mkdir -p /tmp/docker-config

          apt-get update
          apt-get install -y fontconfig libfontconfig1

      - name: Verify Godot and Android SDK
        run: |
          set -eux

          godot --version
          java -version

          test -f project.godot
          test -f main.tscn
          test -f main.gd

          test -d /usr/lib/android-sdk
          test -d /usr/lib/android-sdk/platforms/android-33
          test -d /usr/lib/android-sdk/build-tools/33.0.2

          test -f /usr/lib/android-sdk/platform-tools/adb
          test -x /usr/lib/android-sdk/build-tools/33.0.2/apksigner

          test -f /root/.local/share/godot/export_templates/4.5.stable/android_debug.apk
          test -f /root/.local/share/godot/export_templates/4.5.stable/android_release.apk

          echo "Godot and Android SDK checks passed."

      - name: Configure Java and Debug Keystore
        run: |
          set -eux

          JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/keytool"

          if ! keytool -list \
            -keystore /root/debug.keystore \
            -storepass android \
            -alias androiddebugkey >/dev/null 2>&1; then

            rm -f /root/debug.keystore

            keytool -genkeypair \
              -keystore /root/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p /root/.config/godot

          cat > /root/.config/godot/editor_settings-4.5.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Fix Android texture compression setting
        run: |
          set -eux

          if grep -q '^textures/vram_compression/import_etc2_astc=' project.godot; then
            sed -i \
              's/^textures\/vram_compression\/import_etc2_astc=.*/textures\/vram_compression\/import_etc2_astc=true/' \
              project.godot
          else
            sed -i \
              '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' \
              project.godot
          fi

          echo "Android texture compression setting:"
          grep 'import_etc2_astc' project.godot

          rm -rf .godot/imported

      - name: Create Android export preset
        run: |
          mkdir -p build

          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/BangladeshCarSimulator.apk"
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]

          custom_template/debug=""
          custom_template/release=""

          gradle_build/use_gradle_build=false
          gradle_build/gradle_build_directory=""
          gradle_build/android_source_template=""
          gradle_build/compress_native_libraries=false
          gradle_build/export_format=0

          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false

          version/code=1
          version/name="1.0.0"

          package/unique_name="com.example.bangladeshcarsimulator"
          package/name="Bangladesh Realistic Car Simulator"
          package/signed=true
          EOF

          echo "Android preset created."

      - name: Import Godot project
        run: |
          set -eux

          godot --headless --editor --path . --quit --verbose

      - name: Verify project and export configuration
        run: |
          set -eux

          test -f project.godot
          test -f main.tscn
          test -f main.gd
          test -f export_presets.cfg

          grep -q \
            'textures/vram_compression/import_etc2_astc=true' \
            project.godot

          grep -q 'name="Android"' export_presets.cfg

          keytool -list \
            -keystore /root/debug.keystore \
            -storepass android \
            -alias androiddebugkey

          echo "Project configuration checks passed."

      - name: Export Android Debug APK
        run: |
          set -eux

          godot --headless --verbose --path . \
            --export-debug "Android" \
            build/BangladeshCarSimulator.apk

          test -s build/BangladeshCarSimulator.apk

          echo "ANDROID APK BUILD SUCCESSFUL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangladesh-Car-Simulator-APK
          path: build/BangladeshCarSimulator.apk
          if-no-files-found: error
