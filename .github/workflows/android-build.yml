name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Godot Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.5

    env:
      HOME: /root
      XDG_CONFIG_HOME: /root/.config
      XDG_DATA_HOME: /root/.local/share
      DOCKER_CONFIG: /tmp/docker-config
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
      GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
      GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install font support
        run: |
          apt-get update
          apt-get install -y fontconfig libfontconfig1
          mkdir -p /tmp/docker-config
          mkdir -p build

      - name: Check Android tools
        run: |
          godot --version
          java -version
          test -f /usr/lib/android-sdk/platform-tools/adb
          test -f /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          test -f /root/debug.keystore
          test -f /root/.local/share/godot/export_templates/4.5.stable/android_debug.apk

      - name: Configure Godot
        run: |
          mkdir -p /root/.config/godot

          cat > /root/.config/godot/editor_settings-4.5.tres <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Create Android preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/BangladeshCarSimulator.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0.0"
          version/min_sdk=23
          version/target_sdk=33
          package/unique_name="com.example.bangladeshcarsimulator"
          package/name="Bangladesh Realistic Car Simulator"
          EOF

      - name: Import project
        run: |
          godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          godot --headless --verbose --path . \
            --export-debug "Android" \
            build/BangladeshCarSimulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangladesh-Car-Simulator-APK
          path: build/BangladeshCarSimulator.apk
          if-no-files-found: error
