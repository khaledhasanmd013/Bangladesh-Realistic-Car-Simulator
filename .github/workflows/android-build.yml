
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Godot Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.5

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create Android export preset
        run: |
          mkdir -p build

          cat > export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/BangladeshCarSimulator.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          architectures/x86=false
          architectures/x86_64=false
          version/code=1
          version/name="1.0.0"
          package/unique_name="com.example.bangladeshcarsimulator"
          package/name="Bangladesh Realistic Car Simulator"
          EOF

      - name: Import Godot project
        run: |
          godot --headless --editor --path . --quit

      - name: Build APK
        run: |
          godot --headless --path . \
          --export-debug "Android" \
          build/BangladeshCarSimulator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangladesh-Car-Simulator-APK
          path: build/BangladeshCarSimulator.apk
          if-no-files-found: error
